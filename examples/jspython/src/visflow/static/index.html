<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisFlow - 3D Interactive Data Visualization Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>VisFlow</h1>
            <div class="toolbar">
                <button id="run-btn">Run Code (Ctrl+R)</button>
                <button id="example-btn">Load Example</button>
                <input type="file" id="file-input" accept=".csv" style="display: none;">
                <button id="upload-btn">Upload CSV</button>
            </div>
        </header>

        <div class="main-content">
            <div class="panel editor-panel">
                <textarea id="code-editor" spellcheck="false">
# Sample code - Calculate fire risk from weather data
import pandas as pd
import numpy as np

def calculate_fire_risk(temperature, humidity, wind_speed):
    return (temperature * wind_speed) / (humidity + 10)

# Process data and send to 3D visualization
if data is not None:
    data['fire_risk'] = calculate_fire_risk(data['temperature'], data['humidity'], data['wind_speed'])
    result = data[['latitude', 'longitude', 'fire_risk']]
else:
    # Create sample data if none uploaded
    sample_data = {
        'latitude': np.random.uniform(-90, 90, 1000),
        'longitude': np.random.uniform(-180, 180, 1000),
        'temperature': np.random.uniform(20, 40, 1000),
        'humidity': np.random.uniform(20, 80, 1000),
        'wind_speed': np.random.uniform(5, 25, 1000)
    }
    df = pd.DataFrame(sample_data)
    df['fire_risk'] = calculate_fire_risk(df['temperature'], df['humidity'], df['wind_speed'])
    result = df[['latitude', 'longitude', 'fire_risk']]
</textarea>
            </div>
            <div class="panel visualization-panel">
                <div id="visualization-container"></div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="panel-section">
                <h3>Data Preview</h3>
                <div id="data-preview"></div>
            </div>
            <div class="panel-section">
                <h3>Logs</h3>
                <div id="logs"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
