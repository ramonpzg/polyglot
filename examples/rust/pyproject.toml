[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "video-filters"
version = "0.1.0"
description = "Real-time video processing with Rust"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "maturin>=1.9.4",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "video_filters"
