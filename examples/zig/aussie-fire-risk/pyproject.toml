[project]
name = "aussie-fire-risk"
version = "0.1.0"
description = "Aussie Fire Risk Calculator: Python + Zig bushfire risk modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aussie Fire Risk Team" }]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "typer>=0.9",
  "rich>=13.0",
]

[project.scripts]
fire-calc = "fire_calc.cli:app"

[tool.uv]
index-url = "https://pypi.org/simple"
dev-dependencies = [
  "pytest>=7.4",
  "pytest-benchmark>=4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
