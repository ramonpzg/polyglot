name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Sync deps
        working-directory: aussie-fire-risk
        run: |
          uv sync
      - name: Run tests (without Zig lib)
        working-directory: aussie-fire-risk
        run: |
          uv run pytest -q
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0
      - name: Build Zig library
        working-directory: aussie-fire-risk/src/fire_calc_zig
        run: zig build -Doptimize=ReleaseFast
      - name: Run tests (with Zig lib)
        working-directory: aussie-fire-risk
        env:
          FIRE_CALC_LIB_PATH: ${{ github.workspace }}/aussie-fire-risk/src/fire_calc_zig/zig-out/lib/libfire_calc.so
        run: |
          uv run pytest -q

